[package]
name = "tiktok-crosspost"
default-run = "tiktok-crosspost"
version = "0.1.0"
edition = "2021"
description = "Application to cross-post TikTok content to other social media platforms"
authors = ["Your Name <your.email@example.com>"]

[lib]
name = "tiktok_crosspost"
path = "src/lib.rs"

[dependencies]
# HTTP client for API requests - optimized features
reqwest = { version = "0.11", features = ["json", "multipart"], default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "process"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Utilities - optimized versions
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
dotenv = "0.15"
config = "0.14"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"
url = "2.5"
rand = "0.8"
once_cell = "1.19"

# For interactive CLI - optimized
dialoguer = "0.11"
console = "0.15"
clap = { version = "4.5", features = ["derive"] }

# For browser automation - optimized
headless_chrome = "1.0"

# Performance optimizations
rustc-hash = "1.1"

# Cryptography for content backup
sha2 = "0.10"

[[bin]]
name = "config_wizard"
path = "src/bin/config_wizard.rs"
