[package]
name = "tiktok-crosspost"
default-run = "tiktok-crosspost"
version = "0.1.0"
edition = "2024"
description = "Application to cross-post TikTok content to other social media platforms"
authors = ["Your Name <your.email@example.com>"]

[lib]
name = "tiktok_crosspost"
path = "src/lib.rs"

[dependencies]
# HTTP client for API requests
reqwest = { version = "0.11", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.7"

# Social media API libraries
# Note: These are placeholders for real API clients
# In a production environment, you would use actual API client libraries
# google-youtube3 = "5.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
config = "0.13"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"
url = "2.3"
rand = "0.8"
once_cell = "1.18"

# For scheduled tasks
# tokio-cron-scheduler = "0.9.4" # No longer needed, using custom scheduler

# For interactive CLI
dialoguer = "0.10.4"
console = "0.15.7"
clap = { version = "4.4", features = ["derive"] }

# For browser automation
headless_chrome = "1.0.14"
serde_derive = "1.0"

[[bin]]
name = "config_wizard"
path = "src/bin/config_wizard.rs"
